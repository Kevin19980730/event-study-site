<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Study — GICS industries, sectors & asset classes</title>
<link rel="stylesheet" href="app.css?v=b88969dfaf">
<script src="cards.js?v=67b98b55ee"></script>
<script src="conds.js?v=41b6a91d25"></script>
<script src="site.js?v=c95f5b4af6"></script>
<style>#btn-update{display:none}</style>
</head>
<body>
<header>
  <h1>Event Study</h1>
  <nav class="tabs">
    <button class="on">Event study</button>
    <button onclick="location.href='rotate.html'">Rotation</button>
    <button onclick="location.href='seasonal.html'">Seasonality</button>
  </nav>
  <span class="pill" id="p-data">loading…</span>
  <span class="pill" id="p-official"></span>
  <span class="spacer"></span>
  <button id="theme">◐</button>
  <button id="btn-update">Update data</button>
</header>

<main>
  <div class="card">
    <h2>Event criteria</h2>
    <div id="conds"></div>
    <button id="add-cond" style="font-size:12px;padding:4px 10px">+ Add condition</button>

    <div class="opts">
      <label class="opt">Measure returns on
        <select id="measure-grp"></select> <select id="measure"></select></label>
      <label class="opt">Trigger
        <select id="mode">
          <option value="first_entry">first entry into condition</option>
          <option value="every_day">every qualifying day</option>
        </select></label>
      <label class="opt">Min gap
        <input type="number" id="gap" value="63" min="0" step="1"> <span class="muted">trading days</span></label>
      <label class="opt" title="Keep only the X most extreme events by the chosen column. Every statistic then covers just those X.">Show
        <select id="topn"><option value="">all events</option>
          <option value="5">top 5</option><option value="10">top 10</option>
          <option value="20">top 20</option><option value="25">top 25</option>
          <option value="50">top 50</option><option value="100">top 100</option></select>
        <span class="muted">by</span>
        <select id="topdir"><option value="lowest">lowest</option><option value="highest">highest</option></select>
        <select id="topcol"></select></label>
      <label class="opt">From <input type="date" id="start"></label>
      <label class="opt">To <input type="date" id="end"></label>
      <span class="spacer"></span>
      <button class="primary" id="run">Run study</button>
      <button id="csv">Export CSV</button>
    </div>

    <div class="presets">
      <span class="muted" style="font-size:12px;align-self:center">Presets:</span>
      <button data-preset="semis20">Semis −20% from 52W high</button>
      <button data-preset="spx10">S&amp;P 500 −10% from 52W high</button>
      <button data-preset="vix30">VIX above 30</button>
      <button data-preset="spxdown5">S&amp;P 500 5 down days in a row</button>
      <button data-preset="spxdown5x">S&amp;P 500 5+ down days, −5% or worse</button>
      <button data-preset="semis20spx">Semis −20% while S&amp;P 500 −10%</button>
      <button data-preset="midoct">Midterm-year October</button>
      <button data-preset="midpre">Midterm: day before election</button>
      <button data-preset="midpost">Midterm: day after election</button>
      <button data-preset="midflipR">Midterm: day after, Congress flipped D → R</button>
      <button data-preset="midflipD">Midterm: day after, Congress flipped R → D</button>
      <button data-preset="midnoflip">Midterm: day after, no flip</button>
      <button data-preset="prespre">Presidential: day before election</button>
      <button data-preset="prespost">Presidential: day after election</button>
      <button data-preset="oil">Oil −25% from 52W high</button>
      <button data-preset="spxworst">S&amp;P 500 10 worst days</button>
      <button data-preset="br200">S&amp;P 500 breadth: &lt;15% above 200D MA</button>
      <button data-preset="brndx50">Nasdaq 100 breadth: &lt;10% above 50D MA</button>
      <button data-preset="brnl">S&amp;P 500: &gt;20% at new 52W lows</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div id="out"></div>
</main>

<div class="tip" id="tip"></div>

<script>
const $ = s => document.querySelector(s);
let SERIES = [], METRICS = [], LAST = null;

/* ---------- theme ---------- */
$('#theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
};

/* ---------- helpers ---------- */
const pct = v => v === null || v === undefined ? '' : (v * 100).toFixed(1) + '%';

/* Diverging fill anchored at zero: neg <- neutral -> pos.
   Emitted as color-mix() against the CSS custom properties rather than a baked
   rgb() value, so the cells restyle themselves when the theme flips (OS setting
   or the toggle) without re-rendering the table. Saturation caps at 60% so the
   most extreme cell in a column still holds its text legibly: on the terminal
   ground the strongest cell measures 5.3:1 (loss) and 4.9:1 (gain) against the
   text, and 78% -- the old cap, set for the light sheet -- fell to 3.5:1. */
const CAP = 60;
function heat(v, scale) {
  if (v === null || v === undefined || !scale) return '';
  const t = Math.max(-1, Math.min(1, v / scale));
  if (!t) return '';
  const pole = t < 0 ? '--neg' : '--pos';
  return `color-mix(in srgb, var(${pole}) ${(Math.abs(t) * CAP).toFixed(1)}%, var(--mid))`;
}

/* condition rows: static/conds.js */
$('#add-cond').onclick = () => addCond('ac:s_p500', 'dd_52w_high', '<=', -10);

/* ---------- presets ---------- */
const PRESETS = {
  semis20:    [['ind:semiconductors_semiconductor_equipment', 'dd_52w_high', '<=', -20]],
  spx10:      [['ac:s_p500', 'dd_52w_high', '<=', -10]],
  vix30:      [['ac:vix', 'price', '>=', 30]],
  spxdown5:   [['ac:s_p500', 'down_streak', '>=', 5]],
  spxdown5x:  [['ac:s_p500', 'down_streak', '>=', 5, 5]],
  semis20spx: [['ind:semiconductors_semiconductor_equipment', 'dd_52w_high', '<=', -20],
               ['ac:s_p500', 'dd_52w_high', '<=', -10]],
  midoct:  [['ac:s_p500', 'cycle_year', '==', 2], ['ac:s_p500', 'month', '==', 10]],
  midpre:  [['ac:s_p500', 'midterm_day', '==', -1]],
  midpost: [['ac:s_p500', 'midterm_day', '==', 1]],
  midflipR: [['ac:s_p500', 'midterm_day', '==', 1], ['ac:s_p500', 'midterm_flip', 'has', 1]],
  midflipD: [['ac:s_p500', 'midterm_day', '==', 1], ['ac:s_p500', 'midterm_flip', 'has', 2]],
  midnoflip: [['ac:s_p500', 'midterm_day', '==', 1], ['ac:s_p500', 'midterm_flip', 'has', 8]],
  prespre:  [['ac:s_p500', 'pres_day', '==', -1]],
  prespost: [['ac:s_p500', 'pres_day', '==', 1]],
  oil:        [['ac:oil', 'dd_52w_high', '<=', -25]],
  br200:      [['br:SPX', 'br_ma200', '<=', 15]],
  brndx50:    [['br:NDX', 'br_ma50', '<=', 10]],
  brnl:       [['br:SPX', 'br_nl', '>=', 20]],
  spxworst:   {conds: [['ac:s_p500', 'ret_1d', '<=', -3]], mode: 'every_day', gap: 0,
               top: [10, 'lowest', 'Last 1D']},
};
/* a preset defines the whole study, so anything it doesn't set goes back to default */
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
  const p = PRESETS[b.dataset.preset], spec = Array.isArray(p) ? {conds: p} : p;
  $('#conds').innerHTML = '';
  spec.conds.forEach(c => addCond(...c));
  resetMeasure();
  $('#mode').value = spec.mode || 'first_entry';
  $('#gap').value = spec.gap ?? 63;
  const [n, dir, col] = spec.top || ['', 'lowest', 'Last 1D'];
  $('#topn').value = n; $('#topdir').value = dir; $('#topcol').value = col;
  run();
});

/* ---------- top X ---------- */
/* any table column can rank; a forward one gets a warning in the output, since
   the forward statistics then describe the selection rather than the events */
const H = ['1D', '1W', '2W', '1M', '3M', '6M', '12M', '18M'];
const RANK_GROUPS = [
  ['At event date', [['52W high', 'distance from 52W high'], ['YTD', 'YTD return']]],
  ['Trailing', H.map(h => ['Last ' + h, 'trailing ' + h + ' return'])],
  ['Forward (look-ahead)', H.map(h => ['Next ' + h, 'forward ' + h + ' return'])],
];
const rankLabel = c => (RANK_GROUPS.flatMap(g => g[1]).find(r => r[0] === c) || [c, c])[1];
$('#topcol').innerHTML = RANK_GROUPS.map(([g, opts]) => `<optgroup label="${g}">` +
  opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('') + '</optgroup>').join('');
$('#topcol').value = 'Last 1D';
let REQ = null;   // the request behind LAST, so the table can show the ranking it used

/* ---------- run ---------- */
function payload() {
  return {conditions: readConds(), measure: $('#measure').value,
          mode: $('#mode').value, min_gap: parseInt($('#gap').value || 0),
          start: $('#start').value, end: $('#end').value,
          top_n: parseInt($('#topn').value || 0), top_dir: $('#topdir').value,
          top_col: $('#topcol').value,
          path_pre: PATH.pre, path_post: PATH.post, br_u: BR.u, br_m: BR.m};
}
async function run() {
  $('#run').disabled = true;
  $('#out').innerHTML = '<div class="card muted">Running…</div>';
  try {
    const req = payload();
    const r = await fetch('/api/study', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(req)});
    const j = await r.json();
    if (!r.ok) { $('#out').innerHTML = `<div class="card err">${j.error}</div>`; return; }
    LAST = j; REQ = req; render(j);
  } catch (e) {
    $('#out').innerHTML = `<div class="card err">${e}</div>`;
  } finally { $('#run').disabled = false; }
}
$('#run').onclick = run;
$('#csv').onclick = async () => {
  const r = await fetch('/api/export.csv', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload())});
  const blob = await r.blob(), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'event_study.csv'; a.click();
};

/* ---------- render ---------- */
function render(j) {
  const cols = j.cols;
  /* "52W high" is a state reading at the event date, not a return, so it gets
     its own header band rather than sitting under "trailing return" */
  const state = cols.filter(c => !c.startsWith('Last') && !c.startsWith('Next') && c !== 'YTD');
  const past = cols.filter(c => c.startsWith('Last') || c === 'YTD');
  const fwd = cols.filter(c => c.startsWith('Next'));
  const GAPS = new Set(['YTD', 'Next 1D']);   // vertical rules between bands
  /* a top-X study lists its events in rank order, with the ranking column outlined */
  const ranked = REQ && REQ.top_n > 0 && j.n_matched > 0;
  const RK = ranked ? REQ.top_col : null;
  const events = ranked
    ? [...j.events].sort((a, b) => (REQ.top_dir === 'lowest' ? 1 : -1) * (a[RK] - b[RK]))
    : j.events;
  const cls = c => (GAPS.has(c) ? 'gap' : '') + (c === RK ? ' sortcol' : '');

  /* per-column symmetric scale anchored at 0 */
  const scale = {};
  for (const c of cols) {
    let m = 0;
    for (const e of j.events) if (e[c] != null) m = Math.max(m, Math.abs(e[c]));
    scale[c] = m || 0.01;
  }

  const th = c => `<th class="${cls(c)}">${c.replace('Last ', '').replace('Next ', '')}</th>`;
  const cellsFor = (fn) => cols.map(fn).join('');
  const cell = (v, c, sc) =>
    `<td class="${cls(c)}" style="background:${heat(v, sc[c])}">${pct(v)}</td>`;

  const dataRow = (e, cls, label) =>
    `<tr class="${cls || ''}"><td class="date">${label || e.date}` +
    `${e.provisional ? '<span class="prov" title="includes estimated data">●</span>' : ''}</td>` +
    cols.map(c => cell(e[c], c, scale)).join('') + '</tr>';

  let rows = events.map(e => dataRow(e)).join('');
  if (!events.length)
    rows = `<tr><td class="date muted" colspan="${cols.length + 1}">No events matched.</td></tr>`;

  /* Where things stand now. Reference only -- it is not an event, so it is
     excluded from every statistic below, including N and the p-values. */
  if (j.latest && !j.latest.is_event) {
    const met = j.now && j.now.met;
    rows += dataRow(j.latest, 'latest',
      `${j.latest.date} <span class="tag">${met ? 'now — condition met' : 'now'}</span>`);
  }

  const statRow = (label, key, cls, sc) =>
    `<tr class="${cls}"><td class="date">${label}</td>` +
    cols.map(c => {
      const v = (cls.includes('base') ? j.baseline : j.stats)[c]?.[key];
      return key === 'n'
        ? `<td class="${GAPS.has(c) ? 'gap' : ''}">${v ?? ''}</td>`
        : cell(v, c, sc);
    }).join('') + '</tr>';

  /* Std dev, counts and p-values are magnitudes, not signed returns -- the
     diverging return ramp would misrepresent them, so they stay uncoloured. */
  const plainRow = (label, fmt, cls, title) =>
    `<tr class="${cls}"><td class="date" ${title ? `title="${title}"` : ''}>${label}</td>` +
    cols.map(c => {
      const [txt, extra] = fmt(c);
      return `<td class="${GAPS.has(c) ? 'gap' : ''}${extra || ''}">${txt}</td>`;
    }).join('') + '</tr>';

  const sdFmt = c => {
    const v = j.stats[c]?.sd;
    return [v == null ? '' : (v * 100).toFixed(1) + '%', ''];
  };
  const indepFmt = c => {
    const v = j.independent?.[c], n = j.stats[c]?.n;
    return [v == null ? '' : String(v), (v != null && n && v < n) ? ' warnval' : ''];
  };
  const pFmt = key => c => {
    const v = j.pvals?.[c]?.[key];
    if (v == null) return ['', ''];
    const mark = v < 0.01 ? ' **' : v < 0.05 ? ' *' : '';
    return [v.toFixed(3) + mark, v < 0.05 ? ' sig' : ''];
  };

  /* stats use their own scale so a single outlier event doesn't wash them out */
  const sscale = {}, wscale = {};
  for (const c of cols) {
    let m = 0;
    for (const k of ['avg', 'median', 'min', 'max']) {
      const v = j.stats[c]?.[k]; if (v != null) m = Math.max(m, Math.abs(v));
      const b = j.baseline[c]?.[k]; if (b != null) m = Math.max(m, Math.abs(b));
    }
    sscale[c] = m || 0.01; wscale[c] = 0.5;
  }
  const winRow = (label, cls) =>
    `<tr class="${cls}"><td class="date">${label}</td>` +
    cols.map(c => {
      const v = (cls.includes('base') ? j.baseline : j.stats)[c]?.win;
      const g = GAPS.has(c) ? 'gap' : '';
      return `<td class="${g}" style="background:${v == null ? '' : heat(v - .5, .5)}">${v == null ? '' : (v * 100).toFixed(0) + '%'}</td>`;
    }).join('') + '</tr>';

  const nIter = j.n_iter || 2000;

  const nm = j.measure.name || j.measure_id;
  $('#out').innerHTML = `
    <div class="card">
      <div class="hero"><span class="n">${j.n_events}</span>
        <span class="lbl">events${ranked ? ` — top ${j.n_events} of ${j.n_matched} by ${REQ.top_dir}
          ${rankLabel(RK)}` : ''} — returns measured on <b>${nm}</b>
        <span class="muted">(${j.measure.ticker || ''})</span></span></div>
      <svg id="chart"></svg>
      <div class="legend">
        <span><span class="sw" style="background:var(--accent)"></span>${nm} index level (log scale)</span>
        <span><span class="sw" style="background:var(--neg);border-radius:50%"></span>event date</span>
      </div>
    </div>

    ${j.paths ? `<div class="card">
      <div class="path-head">
        <h2>Daily path around each event</h2>
        <label class="opt" title="Trading days drawn before and after each event (day 0 = event close = 0%)">
          <span class="muted">before</span> ${pathPick('pre')}
          <span class="muted">after</span> ${pathPick('post')}</label>
      </div>
      <svg id="paths"></svg>
      <div class="legend">
        <span><span class="sw" style="background:var(--accent)"></span>average of all events</span>
        <span><span class="sw" style="background:var(--pos)"></span>ended the window up</span>
        <span><span class="sw" style="background:var(--neg)"></span>ended down</span>
        <span>day 0 = event-date close = 0%; one point per trading day; x axis in trading days from the event (21 = 1M, 126 = 6M, 252 = 12M, 378 = 18M). Hover a line for its values.</span>
      </div>
    </div>` : j.n_events ? `<div class="card hint">The daily path chart is drawn for up to 100 events
      (this study has ${j.n_events}) &mdash; narrow it with Top X or Min gap.</div>` : ''}

    ${j.breadth_snap ? snapCard(j.breadth_snap, j.events.map(e => e.date), j.breadth?.first) : ''}
    ${j.breadth ? breadthCard(j.breadth, j.events.map(e => e.date)) : ''}

    <div class="card">
      <h2>Event returns</h2>
      ${ranked ? `<div class="hint" style="margin:0 0 8px">Ranked by ${REQ.top_dir} ${rankLabel(RK)}
        (outlined): the ${j.n_events} most extreme of ${j.n_matched} matching events${REQ.min_gap
        ? `, no two within ${REQ.min_gap} trading days (Min gap)` : ''}. Every
        statistic below, including N independent and the p-values, covers only these
        ${j.n_events}.${RK.startsWith('Next') ? ` <b class="prov">Look-ahead:</b> these events
        were picked by their own forward return, so the forward statistics and p-values
        describe the selection, not an edge you could have traded.` : ''}</div>` : ''}
      <div class="scroll"><table>
        <thead>
          <tr class="grp"><th class="date"></th>
            ${state.length ? `<th colspan="${state.length}">At event date</th>` : ''}
            <th colspan="${past.length}" class="gap">Return to event date (trailing)</th>
            <th colspan="${fwd.length}" class="gap">Forward return from event date</th></tr>
          <tr class="hdr"><th class="date">Date</th>${cols.map(th).join('')}</tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>
          ${statRow('Average', 'avg', 'stat sep', sscale)}
          ${statRow('Median', 'median', 'stat', sscale)}
          ${statRow('Min', 'min', 'stat', sscale)}
          ${statRow('Max', 'max', 'stat', sscale)}
          ${winRow('Win rate', 'stat')}
          ${plainRow('Std dev', sdFmt, 'stat', 'Dispersion of the event returns')}
          ${statRow('N', 'n', 'stat', sscale)}
          ${plainRow('N independent', indepFmt, 'stat',
            'Events whose windows at this horizon do not overlap each other')}
          ${plainRow('p — average', pFmt('avg'), 'sigrow sep',
            'Two-sided placebo p-value')}
          ${plainRow('p — median', pFmt('median'), 'sigrow', 'Two-sided placebo p-value')}
          ${plainRow('p — win rate', pFmt('win'), 'sigrow', 'Two-sided placebo p-value')}
          ${statRow('All-history average', 'avg', 'base sep', sscale)}
          ${statRow('All-history median', 'median', 'base', sscale)}
          ${winRow('All-history win rate', 'base')}
        </tfoot>
      </table></div>
      <div class="legend">
        <span><span class="ramp"></span> negative → 0 → positive (each column scaled to its own range)</span>
        <span><span class="prov">●</span> includes estimated (proxy-bridged) data</span>
        <span><span class="tag">now</span> latest date — reference only, excluded from every statistic below</span>
      </div>
      <div class="hint">
        <b>p-values</b> come from a placebo test: the whole run of event dates is slid
        to ${nIter.toLocaleString()} evenly spaced points across history (wrapping around), which keeps both the
        spacing between events and the autocorrelation of returns intact. The value is
        how often a random placement lands at least as far from centre as this one, so
        it answers “could these dates have done this by chance?”.
        <b>*</b> p&lt;0.05, <b>**</b> p&lt;0.01.
        A plain t-test would be far too generous here, because overlapping return
        windows make the observations dependent — see <b>N independent</b>, which counts
        how many events at each horizon do not share price history with another event.
        Where that is much smaller than N, treat even a low p-value with care.
      </div>
    </div>`;

  drawChart(j);
  document.querySelectorAll('.br-pick').forEach(s => s.onchange = () => { BR[s.dataset.k] = s.value; run(); });
  if (j.paths) {
    document.querySelectorAll('.path-pick').forEach(s => s.onchange = () => { PATH[s.dataset.k] = +s.value; run(); });
    drawPaths(j.paths);
  }
}

/* ---------- breadth around events ---------- */
/* which breadth series the card shows; lives here because the card is re-rendered every run */
const BR = {u: 'SPX', m: 'br_ma200'};
/* shading direction: green = healthier breadth; more new lows / oversold members is weaker */
const BR_SIGN = m => m === 'br_nl' || m === 'br_rsilo' ? -1 : 1;
/* every event of the study, in date order: rows with breadth, plus a greyed row for
   each event the universe's breadth history doesn't cover (so none vanish silently) */
function withMissing(rows, evDates, uname, first, ncols, render) {
  const have = new Map(rows.map(r => [r.date, r]));
  return [...new Set([...evDates, ...rows.map(r => r.date)])].sort().map(d => have.has(d) ? render(have.get(d))
    : `<tr class="nodata"><td class="date muted">${d}</td><td class="muted" colspan="${ncols}">no ${uname} breadth data${
        first && d < first ? ` (history starts ${first})` : ''}</td></tr>`).join('');
}
function breadthCard(B, evDates = []) {
  const f = v => v == null ? '' : v.toFixed(1);
  const dev = B.events.flatMap(e => e.values).filter(v => v != null).map(v => Math.abs(v - B.hist_avg));
  const sc = Math.max(1, ...dev);
  const cellv = v => `<td style="background:${v == null ? '' : heat(BR_SIGN(B.metric) * (v - B.hist_avg), sc)}">${f(v)}</td>`;
  const ev = B.offsets.indexOf('Event');
  const cls = j => j === ev ? ' class="gap sortcol"' : j === ev + 1 ? ' class="gap"' : '';
  const row = e => `<tr><td class="date">${e.date}</td>${e.values.map((v, j) =>
    cellv(v).replace('<td', `<td${cls(j)}`)).join('')}</tr>`;
  const stat = (label, arr, fmt, heatIt) => `<tr class="stat"><td class="date">${label}</td>${arr.map((v, j) =>
    (heatIt ? cellv(v) : `<td>${fmt(v)}</td>`).replace('<td', `<td${cls(j)}`)).join('')}</tr>`;
  const sgn = v => v == null ? '' : (v > 0 ? '+' : '') + v.toFixed(1) + ' pp';
  const uOpts = BREADTH_UNIVERSES.map(([c, l]) => `<option value="${c}"${c === BR.u ? ' selected' : ''}>${l}</option>`).join('');
  const mOpts = METRICS.filter(m => isBreadthMetric(m.id)).map(m =>
    `<option value="${m.id}"${m.id === BR.m ? ' selected' : ''}>${m.label.replace('Breadth: ', '')}</option>`).join('');
  return `<div class="card">
    <div class="path-head">
      <h2>Breadth around events</h2>
      <label class="opt"><select class="br-pick" data-k="u">${uOpts}</select>
        <select class="br-pick" data-k="m">${mOpts}</select></label>
    </div>
    <div class="scroll"><table>
      <thead><tr class="hdr"><th class="date">Event</th>${B.offsets.map((o, j) =>
        `<th${cls(j)}>${o === 'Event' ? 'Event day' : o}</th>`).join('')}</tr></thead>
      <tbody>${withMissing(B.events, evDates, BREADTH_UNIVERSES.find(([c]) => c === B.universe)?.[1] || B.universe,
        B.first, B.offsets.length, row)}</tbody>
      <tfoot>
        ${stat('Average', B.stats.avg, f, true).replace('class="stat"', 'class="stat sep"')}
        ${stat('Median', B.stats.median, f, true)}
        ${stat('Avg change vs event day', B.stats.chg, sgn, false)}
        ${stat('N', B.stats.n, v => v, false)}
      </tfoot>
    </table></div>
    <div class="legend">
      <span>${B.label.replace('Breadth: ', '')} — % of ${BREADTH_UNIVERSES.find(([c]) => c === B.universe)?.[1] || B.universe} members, at fixed trading-day offsets from each event (−3M = 63 sessions before … +12M = 252 after)</span>
      <span>shading: weaker → healthier than the all-history average of <b>${f(B.hist_avg)}%</b> (median ${f(B.hist_median)}%), ${B.first} → ${B.last}${BR_SIGN(B.metric) < 0 ? ' — for this internal a higher reading is weaker breadth' : ''}</span>
    </div>
  </div>`;
}

/* all 7 internals of the chosen universe on each event date */
function snapCard(B, evDates = [], first = null) {
  const f = v => v == null ? '' : v.toFixed(1);
  const sc = B.stats.hist_avg.map((h, j) => Math.max(1, ...B.events.map(e => e.values[j])
    .filter(v => v != null).map(v => Math.abs(v - h))));
  const cellv = (v, j) => `<td style="background:${v == null ? '' :
    heat(BR_SIGN(B.metrics[j]) * (v - B.stats.hist_avg[j]), sc[j])}">${f(v)}</td>`;
  const row = (label, vals, cls, heatIt = true) => `<tr${cls ? ` class="${cls}"` : ''}><td class="date">${label}</td>${
    vals.map((v, j) => heatIt ? cellv(v, j) : `<td>${v == null ? '' : v}</td>`).join('')}</tr>`;
  const uOpts = BREADTH_UNIVERSES.map(([c, l]) => `<option value="${c}"${c === BR.u ? ' selected' : ''}>${l}</option>`).join('');
  const uname = BREADTH_UNIVERSES.find(([c]) => c === B.universe)?.[1] || B.universe;
  const short = l => l.replace('Breadth: ', '').replace('% above ', '> ').replace('% at new ', 'new ').replace('% with ', '');
  return `<div class="card">
    <div class="path-head">
      <h2>Breadth at event date</h2>
      <label class="opt"><select class="br-pick" data-k="u">${uOpts}</select></label>
    </div>
    <div class="scroll"><table>
      <thead><tr class="hdr"><th class="date">Event</th>${B.labels.map(l => `<th title="${l}">${short(l)}</th>`).join('')}</tr></thead>
      <tbody>${withMissing(B.events, evDates, uname, first, B.labels.length, e => row(e.date, e.values))}
        ${B.latest && !evDates.includes(B.latest.date)   /* the newest bar is itself an event: don't repeat it */
          ? row(`${B.latest.date} <span class="tag">now</span>`, B.latest.values, 'latest') : ''}</tbody>
      <tfoot>
        ${row('Average', B.stats.avg, 'stat sep')}
        ${row('Median', B.stats.median, 'stat')}
        ${row('N', B.stats.n, 'stat', false)}
        ${row('All-history average', B.stats.hist_avg, 'base sep')}
        ${row('All-history median', B.stats.hist_median, 'base')}
      </tfoot>
    </table></div>
    <div class="legend">
      <span>% of ${uname} members on each event's session (as of that close); shading: weaker &rarr; healthier than each internal's all-history average (for new lows and RSI &lt; 30, higher = weaker)</span>
      <span><span class="tag">now</span> latest reading &mdash; reference only, excluded from the statistics</span>
    </div>
  </div>`;
}

/* path chart window, in trading days on the table's horizon convention; the pickers
   sit on the chart card, which is re-rendered every run, so the choice lives here */
const PATH = {pre: 10, post: 21};
const PATH_OPTS = {
  pre: [[0, 'none'], [5, '1W'], [10, '2W'], [21, '1M'], [63, '3M'], [126, '6M'], [252, '12M']],
  post: [[5, '1W'], [10, '2W'], [21, '1M'], [63, '3M'], [126, '6M'], [252, '12M'], [378, '18M']],
};
const pathPick = k => `<select class="path-pick" data-k="${k}">${PATH_OPTS[k].map(([v, l]) =>
  `<option value="${v}"${v === PATH[k] ? ' selected' : ''}>${l}</option>`).join('')}</select>`;

/* ---------- chart: each event's daily path, rebased so the event close is 0% ---------- */
function drawPaths(P) {
  const svg = $('#paths'), off = P.offsets;
  const W = svg.clientWidth || 900, H = 380, m = {t: 12, r: 70, b: 24, l: 52};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const all = P.events.flatMap(e => e.path).filter(v => v !== null);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  const pad = (hi - lo) * 0.04 || 0.01; lo -= pad; hi += pad;
  const k0 = off[0], k1 = off[off.length - 1] === k0 ? k0 + 1 : off[off.length - 1];
  const X = k => m.l + (k - k0) / (k1 - k0) * iw;
  const Y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  const line = path => {
    let d = '';
    path.forEach((v, j) => { if (v !== null) d += (d ? 'L' : 'M') + X(off[j]).toFixed(1) + ' ' + Y(v).toFixed(1); });
    return d;
  };
  const lastOf = path => { for (let j = path.length - 1; j >= 0; j--) if (path[j] !== null) return j; return -1; };
  const lbl = e => e.date.slice(0, 4);

  /* y ticks at a round % step */
  const raw = (hi - lo) / 6, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = ([1, 2, 2.5, 5, 10].find(f => f * mag >= raw) || 10) * mag;
  const yt = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) yt.push(Math.abs(v) < step / 1e6 ? 0 : v);
  /* short windows tick every few sessions; long ones by month (21 sessions), as the table's horizons */
  const span = k1 - k0, mstep = [1, 2, 3, 6].find(n => span / (21 * n) <= 12) || 12;
  const xstep = span <= 60 ? Math.max(1, Math.ceil(span / 12 / 5) * 5) : 21 * mstep;
  const xt = off.filter(k => k % xstep === 0);
  if (span > 60 && k0 < 0 && k0 % 21 === 0 && !xt.some(k => k < 0)) xt.unshift(k0);   // e.g. −1M before a 2M step
  const xlbl = k => k === 0 ? 'day 0' : (k > 0 ? '+' : '\u2212') + Math.abs(k);

  /* end labels, nudged apart so they don't overprint */
  const ends = P.events.map((e, i) => {
    const j = lastOf(e.path);
    return j < 0 ? null : {i, x: X(off[j]), y: Y(e.path[j]), v: e.path[j], t: lbl(e)};
  }).filter(Boolean).sort((a, b) => a.y - b.y);
  ends.forEach((e, n) => { e.ly = n ? Math.max(e.y, ends[n - 1].ly + 11) : e.y; });
  const over = ends.length ? ends[ends.length - 1].ly - (m.t + ih + 4) : 0;
  if (over > 0) ends.forEach(e => { e.ly -= over; });

  const col = v => v >= 0 ? 'var(--pos)' : 'var(--neg)';
  const pct = v => (v >= 0 ? '+' : '') + (v * 100).toFixed(Math.abs(v) < 0.1 ? 2 : 1) + '%';
  const dp = step * 100 < 1 ? 1 : 0;
  svg.style.height = H + 'px';
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML =
    yt.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"
        stroke="${v === 0 ? 'var(--border-strong)' : 'var(--border)'}" stroke-width="1"${v === 0 ? ' stroke-dasharray="4 3"' : ''}/>
      <text x="${m.l - 7}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10"
        fill="var(--text-muted)">${(v * 100).toFixed(dp)}%</text>`).join('') +
    xt.map(k => `<text x="${X(k).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10"
        fill="var(--text-muted)">${xlbl(k)}</text>`).join('') +
    `<line x1="${X(0).toFixed(1)}" x2="${X(0).toFixed(1)}" y1="${m.t}" y2="${m.t + ih}"
       stroke="var(--border-strong)" stroke-width="1.5"/>` +
    P.events.map((e, i) => {
      const j = lastOf(e.path);
      return `<path class="ev" data-i="${i}" d="${line(e.path)}" fill="none" stroke="${col(j < 0 ? 0 : e.path[j])}"
        stroke-width="1.3" stroke-opacity="0.55" stroke-linejoin="round"/>`;
    }).join('') +
    `<path d="${line(P.avg)}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>` +
    ends.map(e => `<text class="ev-l" data-i="${e.i}" x="${(e.x + 5).toFixed(1)}" y="${(e.ly + 3.5).toFixed(1)}"
        font-size="10" fill="${col(e.v)}">${e.t}</text>`).join('') +
    `<line id="pcross" y1="${m.t}" y2="${m.t + ih}" stroke="var(--border-strong)" stroke-width="1" style="display:none"/>`;

  const tip = $('#tip'), cross = svg.querySelector('#pcross');
  const focus = i => svg.querySelectorAll('.ev, .ev-l').forEach(el => {
    const on = i === null || +el.dataset.i === i;
    el.style.opacity = on ? '' : 0.12;
    if (el.tagName === 'path') {
      el.setAttribute('stroke-opacity', i !== null && on ? 1 : 0.55);
      el.setAttribute('stroke-width', i !== null && on ? 2.4 : 1.3);
    }
  });
  svg.onmousemove = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width), py = (ev.clientY - r.top) * (H / r.height);
    if (px < m.l || px > W - m.r) { tip.style.display = 'none'; cross.style.display = 'none'; focus(null); return; }
    const j = Math.max(0, Math.min(off.length - 1, Math.round((px - m.l) / iw * (k1 - k0))));
    /* nearest event line at this session */
    let best = null, bd = 14;
    P.events.forEach((e, i) => {
      const v = e.path[j];
      if (v !== null && Math.abs(Y(v) - py) < bd) { bd = Math.abs(Y(v) - py); best = i; }
    });
    focus(best);
    cross.style.display = ''; cross.setAttribute('x1', X(off[j])); cross.setAttribute('x2', X(off[j]));
    tip.style.display = 'block';
    tip.innerHTML = `<b>day ${off[j] > 0 ? '+' : ''}${off[j]}</b><br>` +
      (best !== null ? `${P.events[best].date}: ${pct(P.events[best].path[j])}<br>` : '') +
      (P.avg[j] !== null ? `average: ${pct(P.avg[j])}` : '');
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - 170) + 'px';
    tip.style.top = (ev.clientY - 10) + 'px';
  };
  svg.onmouseleave = () => { tip.style.display = 'none'; cross.style.display = 'none'; focus(null); };
}

/* ---------- chart: log-scale line + event markers ---------- */
function drawChart(j) {
  const svg = $('#chart'), c = j.chart;
  if (!c.dates.length) return;
  const W = svg.clientWidth || 900, H = 230, m = {t: 10, r: 12, b: 22, l: 52};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xs = c.dates.map(d => +new Date(d));
  const x0 = xs[0], x1 = xs[xs.length - 1];
  const vals = c.levels.filter(v => v > 0);
  const lo = Math.log10(Math.min(...vals)), hi = Math.log10(Math.max(...vals));
  const X = t => m.l + (t - x0) / (x1 - x0) * iw;
  const Y = v => m.t + ih - (Math.log10(v) - lo) / (hi - lo) * ih;

  let d = '';
  for (let i = 0; i < xs.length; i++) {
    if (c.levels[i] <= 0) continue;
    d += (d ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(c.levels[i]).toFixed(1);
  }
  const lvlAt = t => {
    let best = 0, bd = Infinity;
    for (let i = 0; i < xs.length; i++) { const dd = Math.abs(xs[i] - t); if (dd < bd) { bd = dd; best = i; } }
    return best;
  };
  const ticks = [];
  const years = new Date(x1).getFullYear() - new Date(x0).getFullYear();
  const stepY = years > 60 ? 10 : years > 30 ? 5 : years > 12 ? 2 : 1;
  for (let y = Math.ceil(new Date(x0).getFullYear() / stepY) * stepY;
       y <= new Date(x1).getFullYear(); y += stepY) {
    const t = +new Date(y + '-01-01'); if (t >= x0 && t <= x1) ticks.push([t, y]);
  }
  const yt = [];
  for (let e = Math.ceil(lo); e <= Math.floor(hi); e++) yt.push(Math.pow(10, e));

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML =
    yt.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"
        stroke="var(--border)" stroke-width="1"/>
      <text x="${m.l - 7}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10"
        fill="var(--text-muted)">${v >= 1000 ? (v / 1000) + 'k' : v}</text>`).join('') +
    ticks.map(([t, y]) => `<text x="${X(t).toFixed(1)}" y="${H - 6}" text-anchor="middle"
        font-size="10" fill="var(--text-muted)">${y}</text>`).join('') +
    `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"
       stroke-linejoin="round" stroke-linecap="round"/>` +
    c.events.map(ds => {
      const t = +new Date(ds), i = lvlAt(t);
      if (t < x0 || t > x1 || c.levels[i] <= 0) return '';
      return `<circle cx="${X(t).toFixed(1)}" cy="${Y(c.levels[i]).toFixed(1)}" r="4.5"
        fill="var(--neg)" stroke="var(--surface-1)" stroke-width="2"><title>${ds}</title></circle>`;
    }).join('') +
    `<line id="cross" y1="${m.t}" y2="${m.t + ih}" stroke="var(--border-strong)"
       stroke-width="1" style="display:none"/>`;

  const tip = $('#tip'), cross = svg.querySelector('#cross');
  svg.onmousemove = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width);
    if (px < m.l || px > W - m.r) { tip.style.display = 'none'; cross.style.display = 'none'; return; }
    const t = x0 + (px - m.l) / iw * (x1 - x0), i = lvlAt(t);
    cross.style.display = ''; cross.setAttribute('x1', X(xs[i])); cross.setAttribute('x2', X(xs[i]));
    tip.style.display = 'block';
    tip.innerHTML = `<b>${c.dates[i]}</b><br>${c.levels[i].toLocaleString(undefined, {maximumFractionDigits: 2})}`;
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - 130) + 'px';
    tip.style.top = (ev.clientY - 10) + 'px';
  };
  svg.onmouseleave = () => { tip.style.display = 'none'; cross.style.display = 'none'; };
}

/* the chart is sized from its measured width, so it has to be redrawn -- not
   just rescaled -- when the viewport changes, or the axis labels shrink with it */
let rzTimer;
addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => { if (LAST && document.querySelector('#chart')) drawChart(LAST);
    if (LAST?.paths && document.querySelector('#paths')) drawPaths(LAST.paths); }, 150);
});

/* ---------- status / update ---------- */
async function status() {
  const s = await (await fetch('/api/status')).json();
  $('#p-data').innerHTML = `data through <b>${s.data_through || '—'}</b>`;
  $('#p-official').innerHTML =
    `Bloomberg workbook through <b>${s.bbg_through || '—'}</b>` +
    (s.official_through && s.official_through !== s.bbg_through
      ? ` · S&amp;P DJI official through <b>${s.official_through}</b>` : '') +
    (s.series_bridged ? ` · ${s.series_bridged} series bridged` : '') +
    (s.ff_through ? ` · <span title="Ken French 49 industry portfolios (CRSP, total return) update monthly, one month behind">Ken French through <b>${s.ff_through}</b></span>` : '') +
    (s.gap_series ? ` · <b class="prov" title="The S&amp;P 1500 industry/sector indices can only be captured one close per day from Yahoo, so days between the last Bloomberg export and the first daily capture are missing. Refresh the Bloomberg workbook in Downloads to fill them with official data.">⚠ ${s.gap_series} series missing up to ${s.gap_sessions} sessions — refresh the Bloomberg workbook</b>` : '');
  $('#btn-update').disabled = s.updating;
  $('#btn-update').textContent = s.updating ? 'Updating…' : 'Update data';
  if (s.updating) setTimeout(status, 3000);
  return s;
}
$('#btn-update').onclick = async () => {
  await fetch('/api/update', {method: 'POST'});
  setTimeout(status, 800);
};

/* ---------- boot ---------- */
(async () => {
  [SERIES, METRICS] = await Promise.all([
    (await fetch('/api/series')).json(),
    (await fetch('/api/metrics')).json(),
  ]);
  initMeasure();
  addCond('ind:semiconductors_semiconductor_equipment', 'dd_52w_high', '<=', -20);
  $('#hint').textContent =
    'Percentages are entered as numbers: −20 means 20% below the 52-week high; up/down streaks are counted in days, and the "& down ≥ %" box next to them ' +
    'adds a minimum total move over the run (e.g. 5 down days, down 5% or more). ' +
    'Multiple conditions are combined with AND. "Min gap" suppresses re-triggers within N trading days ' +
    'so one drawdown episode counts once.';
  await status();
  run();
})();
</script>
